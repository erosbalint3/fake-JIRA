spring:
  datasource:
    url: jdbc:h2:mem:fakejira-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: test-secret-test-secret-test-secret-123
    validity: 1h
  rate-limit:
    enabled: false
  backup:
    cron: "-"
  recurring:
    cron: "-"
  digest:
    cron: "-"
  automation:
    cron: "-"
  update-check:
    enabled: false
