server:
  port: 8080

spring:
  application:
    name: fake-jira
  datasource:
    url: jdbc:h2:file:./data/fakejira;AUTO_SERVER=TRUE
    username: sa
    # Set SPRING_DATASOURCE_PASSWORD to password-protect the database; an existing
    # database without a password is switched over on the next start.
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # Load lazy associations (labels, users, sprints) for lists in batches instead of one query per row.
        default_batch_fetch_size: 100
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      # SSE streams manage their own timeout.
      request-timeout: -1
  # Email is optional. Set SPRING_MAIL_HOST (plus port/username/password) to enable
  # notification emails and password reset links.
  mail:
    host: ${SPRING_MAIL_HOST:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}

app:
  # Public URL of the app, used in email and invite links. When empty, the address admins open
  # the app at is used (learned when an admin signs in).
  base-url: ${APP_BASE_URL:}
  mail:
    from: ${APP_MAIL_FROM:FakeJIRA <no-reply@localhost>}
    inbound:
      # Reply-by-email and email-to-task: the mailbox that receives mail, e.g. jira@example.com.
      # Plus-addressing must deliver jira+anything@example.com to it. Off when empty.
      address: ${APP_MAIL_INBOUND_ADDRESS:}
      # Shared secret for POST /api/inbound/email (header X-Inbound-Secret), for inbound-mail services.
      secret: ${APP_MAIL_INBOUND_SECRET:}
      # Or poll a mailbox over IMAP(S).
      imap:
        host: ${APP_MAIL_INBOUND_IMAP_HOST:}
        port: ${APP_MAIL_INBOUND_IMAP_PORT:993}
        username: ${APP_MAIL_INBOUND_IMAP_USERNAME:}
        password: ${APP_MAIL_INBOUND_IMAP_PASSWORD:}
        folder: ${APP_MAIL_INBOUND_IMAP_FOLDER:INBOX}
        poll-ms: ${APP_MAIL_INBOUND_IMAP_POLL_MS:60000}
  storage:
    dir: ${APP_STORAGE_DIR:./data/attachments}
  registration:
    # Initial sign-up mode (OPEN, INVITE or APPROVAL); admins can change it on the Admin page.
    default-mode: ${APP_REGISTRATION_DEFAULT_MODE:OPEN}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # Headers checked (in order) for the real client IP behind Cloudflare/Caddy.
    client-ip-headers: ${APP_RATE_LIMIT_CLIENT_IP_HEADERS:CF-Connecting-IP,X-Forwarded-For}
  backup:
    dir: ${APP_BACKUP_DIR:./data/backups}
    # Spring cron (sec min hour day month weekday); "-" disables scheduled backups.
    cron: ${APP_BACKUP_CRON:0 30 3 * * *}
    keep: ${APP_BACKUP_KEEP:14}
  digest:
    cron: ${APP_DIGEST_CRON:0 0 7 * * *}
  automation:
    # How often scheduled automation rules (SLA escalation, stale tasks) check their conditions.
    cron: ${APP_AUTOMATION_CRON:0 */5 * * * *}
  push:
    # VAPID "sub" claim; defaults to the app's https base URL.
    subject: ${APP_PUSH_SUBJECT:}
  audit:
    # How long audit log entries are kept.
    retention-days: ${APP_AUDIT_RETENTION_DAYS:365}
  oauth:
    # "Sign in with Google / GitHub". Off until a client id and secret are set. Callback URL to register
    # with the provider: <APP_BASE_URL>/api/auth/oauth/google/callback (or .../github/callback).
    google:
      client-id: ${APP_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${APP_OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${APP_OAUTH_GITHUB_CLIENT_SECRET:}
  db-tcp:
    # Network access to the live H2 database for tools like DBeaver, e.g. 9092. Off when empty;
    # needs SPRING_DATASOURCE_PASSWORD. Connect with jdbc:h2:tcp://HOST:PORT/fakejira
    port: ${APP_DB_TCP_PORT:}
  jwt:
    # Set APP_JWT_SECRET (32+ chars) in production so sessions survive restarts.
    secret: ${APP_JWT_SECRET:}
    validity: 12h
