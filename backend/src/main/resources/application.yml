server:
  port: 8080

spring:
  application:
    name: fake-jira
  datasource:
    url: jdbc:h2:file:./data/fakejira;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    # Set APP_JWT_SECRET (32+ chars) in production so sessions survive restarts.
    secret: ${APP_JWT_SECRET:}
    validity: 12h
